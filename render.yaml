services:
  # ---------------------------------------------------------------------------
  # EduRAG Backend API Service (FastAPI / Python)
  # ---------------------------------------------------------------------------
  - type: web
    name: edurag-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_ENV
        value: "production"
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: "mistral"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: "open-mistral-7b"
      - key: LLM_BASE_URL
        value: "https://api.mistral.ai/v1"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./edurag.db"
      - key: CORS_ORIGINS
        value: "*"

  # ---------------------------------------------------------------------------
  # EduRAG Frontend Web App (React + Vite SPA)
  # ---------------------------------------------------------------------------
  - type: web
    name: edurag-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://edurag-api.onrender.com"
